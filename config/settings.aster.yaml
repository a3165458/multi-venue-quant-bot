exchange:
  kind: aster
  environment: mainnet

trading:
  # Safety gate: Aster V3 starts paused. Verify the sub-account, API Wallet,
  # permissions, symbol, fees, balances, and order sizing before manual resume.
  # Pause blocks maker entries; reduce-only stop/emergency exits remain armed.
  start_paused: true
  # Fail closed instead of mutating account margin settings.
  require_isolated_margin: true
  symbols: [BTCUSDT]
  max_open_orders: 2
  shadow_maker:
    # Evaluate real-time quote intents and virtual fills while trading remains paused.
    # This mode never submits exchange orders.
    enabled: true
    penetration_bps: 2.0
    fill_ratio: 0.5
    markout_horizons_ms: [1000, 5000, 30000]
    max_recent_fills: 50
    persist_interval_secs: 10
  hft_shadow:
    # Multi-profile near-BBO experiment. Metrics only; never submits orders.
    # Requotes are modeled as a single PUT amend so the virtual quote stays on
    # the book; cancel+place request counts are kept only for comparison.
    enabled: true
    quote_notional: 20.0
    penetration_bps: 0.2
    fill_ratio: 0.5
    # Pull a virtual profile after enough 1s markouts are this toxic or worse.
    # Shadow only; never places or resumes real orders.
    toxicity_1s_bps: -2.0
    toxicity_min_samples: 8
    profiles:
      - name: join-250ms
        offset_bps: 0.0
        requote_threshold_ticks: 1
        cooldown_ms: 250
      - name: join-1000ms
        offset_bps: 0.0
        requote_threshold_ticks: 1
        cooldown_ms: 1000
      - name: offset-1bp
        offset_bps: 1.0
        requote_threshold_ticks: 1
        cooldown_ms: 1000
      - name: offset-2bp
        offset_bps: 2.0
        requote_threshold_ticks: 1
        cooldown_ms: 1000
  strategies:
    grid_trading:
      enabled: false
      grid_count: 12
      investment_per_grid: 10
      price_deviation: 0.004
    trend_following:
      enabled: false
      fast_ma: 7
      slow_ma: 50
      stop_loss: 0.08
      take_profit: 0.12
      trailing_stop: 0.0
      notional: 10
      adx_threshold: 0
      adx_period: 14
      confirm_slope_min: 0.005
      confirm_lookback: 3
    maker_quote:
      enabled: true
      spread_bps: 30.0
      per_quote_notional: 10.0
      requote_threshold_bps: 2.0
      requote_cooldown_secs: 5
      soft_cap_notional: 25.0
      hard_cap_notional: 50.0
      trend_filter: true
      ema_period: 20
      trend_block_bps: 6.0
      min_quote_notional: 5.0
      vol_window: 24
      vol_multiplier: 0.5
      cash_open_guard: true
      cash_open_guard_before_minutes: 5
      cash_open_guard_after_minutes: 20
      jump_circuit_breaker_bps: 20.0
      max_book_spread_bps: 40.0
      circuit_breaker_cooldown_secs: 60
      feature_interval_secs: 60
      max_skew_bps: 3.0
      total_quote_budget: 20.0
  position:
    max_single_trade_percent: 25
    max_total_position_percent: 50
    risk_per_trade_percent: 1.0

# Aster's published base tier is modeled as maker 1.0 bps / taker 3.5 bps.
# Verify the actual V3 sub-account fee tier before manually resuming trading.
profitability:
  enabled: true
  entry_fee_bps: 1.0
  exit_fee_bps: 3.5
  entry_slippage_bps: 0.0
  exit_slippage_bps: 1.0
  funding_bps: 1.0
  adverse_selection_bps: 2.0
  min_net_edge_bps: 1.0
  maker_fill_ratio: 0.5
  maker_min_penetration_bps: 2.0

risk:
  stop_loss:
    enabled: true
    max_drawdown_percent: 5
    daily_loss_limit_percent: 2
    position_stop_loss_percent: 2
    position_take_profit_percent: 3
  position_limit:
    max_leverage: 2
    max_position_size: 50
  monitoring_interval_ms: 1000

dashboard:
  enabled: true
  host: "127.0.0.1"
  port: 4028
  refresh_interval_ms: 1000

logging:
  level: info
  file: logs/aster-mainnet.log
  rotation: daily
  format: json
