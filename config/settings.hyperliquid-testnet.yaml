exchange:
  kind: hyperliquid
  environment: testnet

trading:
  start_paused: false
  # Testnet primary-dex coins; HIP-3 "dex:NAME" coins work here too when the
  # builder dex exists on testnet.
  symbols: ["BTC"]
  max_open_orders: 2
  isolated_leverage: 1
  strategies:
    grid_trading:
      enabled: false
      grid_count: 12
      investment_per_grid: 10
      price_deviation: 0.004
    trend_following:
      enabled: false
      fast_ma: 7
      slow_ma: 50
      stop_loss: 0.08
      take_profit: 0.12
      trailing_stop: 0.0
      notional: 10
      adx_threshold: 0
      adx_period: 14
      confirm_slope_min: 0.005
      confirm_lookback: 3
    maker_quote:
      enabled: true
      spread_bps: 30.0
      per_quote_notional: 12.0
      requote_threshold_bps: 2.0
      requote_cooldown_secs: 5
      soft_cap_notional: 30.0
      hard_cap_notional: 60.0
      trend_filter: true
      ema_period: 20
      trend_block_bps: 6.0
      min_quote_notional: 10.0
      vol_window: 24
      vol_multiplier: 0.5
      cash_open_guard: false
      jump_circuit_breaker_bps: 20.0
      max_book_spread_bps: 40.0
      circuit_breaker_cooldown_secs: 60
      feature_interval_secs: 60
      max_skew_bps: 3.0
      total_quote_budget: 24.0
  position:
    max_single_trade_percent: 25
    max_total_position_percent: 50
    risk_per_trade_percent: 1.0

profitability:
  enabled: true
  entry_fee_bps: 1.5
  exit_fee_bps: 4.5
  entry_slippage_bps: 0.0
  exit_slippage_bps: 1.0
  funding_bps: 1.0
  adverse_selection_bps: 2.0
  min_net_edge_bps: 1.0
  maker_fill_ratio: 0.5
  maker_min_penetration_bps: 2.0

risk:
  stop_loss:
    enabled: true
    max_drawdown_percent: 5
    daily_loss_limit_percent: 2
    position_stop_loss_percent: 2
    position_take_profit_percent: 3
  position_limit:
    max_leverage: 2
    max_position_size: 50
  monitoring_interval_ms: 1000

dashboard:
  enabled: true
  host: "127.0.0.1"
  port: 4029
  refresh_interval_ms: 1000

logging:
  level: info
  file: logs/hyperliquid-testnet.log
  rotation: daily
  format: json
