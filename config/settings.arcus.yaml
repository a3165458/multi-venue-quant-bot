exchange:
  kind: arcus
  environment: mainnet

trading:
  # Arcus market IDs are discovered at startup; 1 is BTC-USD in the documented universe.
  markets: [1]
  max_open_orders: 8
  strategies:
    grid_trading:
      enabled: false
      grid_count: 12
      investment_per_grid: 30
      price_deviation: 0.004
    trend_following:
      enabled: true
      # 2026-08-09 整年扫描（Arcus BTC 1h 2025-08-09~2026-08-09，capital=1730）:
      #   基线: BTC buy&hold -44.4%, grid 12/30/0.004 -8.2%, 旧 trend 7/21/0.05/0.06 +3.5% (q1 -5.8%)
      #   终选 7/50/0.08/0.12/cmin0.005/clb3/notional=430: 全年 +10.8%, Sharpe 1.40, MaxDD 4.99%
      #   四季度全正(+1.87/+3.41/+1.54/+0.83), 两半年全正; walk-forward H1训练→H2 OOS +2.37%
      #   峰值杠杆 0.26x, 0 强平, 盈亏比 2.46, 10 笔; 斜率确认(clb3)与慢线50 是盈利根因
      #   详见 backtests/results/arcus-year/FINDINGS.md（gitignore）
      fast_ma: 7
      slow_ma: 50
      stop_loss: 0.08
      take_profit: 0.12
      trailing_stop: 0.0
      notional: 430
      adx_threshold: 0
      adx_period: 14
      confirm_slope_min: 0.005
      confirm_lookback: 3
  position:
    max_single_trade_percent: 50
    max_total_position_percent: 200
    risk_per_trade_percent: 1.5

profitability:
  enabled: true
  entry_fee_bps: 2.0
  exit_fee_bps: 2.0
  entry_slippage_bps: 3.0
  exit_slippage_bps: 3.0
  funding_bps: 1.0
  adverse_selection_bps: 4.0
  min_net_edge_bps: 3.0

risk:
  stop_loss:
    enabled: true
    max_drawdown_percent: 10
    daily_loss_limit_percent: 5
    position_stop_loss_percent: 3
    position_take_profit_percent: 5
  position_limit:
    max_leverage: 5
    max_position_size: 100
  monitoring_interval_ms: 1000

dashboard:
  enabled: true
  host: "127.0.0.1"
  port: 4028
  refresh_interval_ms: 1000

logging:
  level: info
  file: logs/arcus.log
  rotation: daily
  format: json
