exchange:
  kind: arcus
  environment: testnet

trading:
  markets: [1]
  max_open_orders: 8
  strategies:
    grid_trading:
      enabled: false
      grid_count: 12
      investment_per_grid: 30
      price_deviation: 0.004
    trend_following:
      enabled: true
      fast_ma: 7
      slow_ma: 21
      stop_loss: 0.05
      take_profit: 0.06
      trailing_stop: 0.0
      notional: 60
      adx_threshold: 0
      adx_period: 14
      confirm_slope_min: 0.005
      confirm_lookback: 3
  position:
    max_single_trade_percent: 50
    max_total_position_percent: 200
    risk_per_trade_percent: 1.5

profitability:
  enabled: true
  entry_fee_bps: 2.0
  exit_fee_bps: 2.0
  entry_slippage_bps: 3.0
  exit_slippage_bps: 3.0
  funding_bps: 1.0
  adverse_selection_bps: 4.0
  min_net_edge_bps: 3.0

risk:
  stop_loss:
    enabled: true
    max_drawdown_percent: 10
    daily_loss_limit_percent: 5
    position_stop_loss_percent: 3
    position_take_profit_percent: 5
  position_limit:
    max_leverage: 5
    max_position_size: 100
  monitoring_interval_ms: 1000

dashboard:
  enabled: true
  host: "127.0.0.1"
  port: 4028
  refresh_interval_ms: 1000

logging:
  level: info
  file: logs/arcus-testnet.log
  rotation: daily
  format: json
