# Lighter.xyz Trading Bot Configuration
lighter:
  # Network configuration
  rest_url: "https://mainnet.zklighter.elliot.ai"
  ws_url: "wss://mainnet.zklighter.elliot.ai/stream"
  chain_id: 304

  # Connection parameters
  connection:
    timeout_ms: 10000
    retry_count: 5
    retry_delay_ms: 2000
    heartbeat_interval_ms: 60000

# Trading configuration
trading:
  # Markets to trade (market_id: 0=ETH, 1=BTC)
  markets: [1]

  # Maximum number of open orders at any time
  max_open_orders: 8

  # Strategy configuration
  strategies:
    grid_trading:
      enabled: false
      grid_count: 12
      investment_per_grid: 30
      price_deviation: 0.004

    trend_following:
      enabled: true
      fast_ma: 7
      slow_ma: 21
      stop_loss: 0.05
      take_profit: 0.06
      trailing_stop: 0.0
      notional: 60
      # ADX 震荡过滤：>0 启用（低于该值=震荡市禁新开仓），0=关闭。
      adx_threshold: 0
      adx_period: 14
      # 慢线斜率确认：>0 启用（开多需 slow EMA 在 lookback 内上涨该比例，开空则下跌），0=关闭。
      confirm_slope_min: 0.005
      confirm_lookback: 3

  # Position management
  position:
    max_single_trade_percent: 50
    max_total_position_percent: 200
    risk_per_trade_percent: 1.5

# Conservative round-trip profitability gate for live entries (1 bp = 0.01%).
# These defaults reflect Lighter Standard's observed zero trading fee, while
# reserving explicit budgets for execution drag and adverse selection.
profitability:
  enabled: true
  entry_fee_bps: 0.0
  exit_fee_bps: 0.0
  entry_slippage_bps: 2.0
  exit_slippage_bps: 2.0
  funding_bps: 0.5
  adverse_selection_bps: 3.0
  min_net_edge_bps: 2.0

# Risk management
risk:
  stop_loss:
    enabled: true
    max_drawdown_percent: 10
    daily_loss_limit_percent: 5
    # Per-position stop-loss/take-profit (percentage from entry)
    position_stop_loss_percent: 3
    position_take_profit_percent: 5

  position_limit:
    max_leverage: 5
    max_position_size: 100

  monitoring_interval_ms: 1000

# Backtest configuration
backtest:
  data:
    start_date: "2024-01-01"
    end_date: "2024-06-01"
    interval: "1h"

  initial_capital: 10000
  commission_percent: 0.0
  slippage_percent: 0.02

  reporting:
    generate_html: true
    save_trades: true
    plot_equity_curve: true

# Dashboard
dashboard:
  enabled: true
  host: "127.0.0.1"
  port: 4028
  refresh_interval_ms: 1000

  charts:
    equity_curve_points: 1000
    order_book_depth: 20

# Logging
logging:
  level: "info"
  file: "logs/multi-venue-quant-bot-lighter-mainnet.log"
  rotation: "daily"
  format: "json"
