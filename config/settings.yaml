# Lighter.xyz Trading Bot Configuration
lighter:
  # Network configuration
  rest_url: "https://mainnet.zklighter.elliot.ai"
  ws_url: "wss://mainnet.zklighter.elliot.ai/stream"
  chain_id: 304

  # Connection parameters
  connection:
    timeout_ms: 10000
    retry_count: 5
    retry_delay_ms: 2000
    heartbeat_interval_ms: 60000

# Trading configuration
trading:
  # Markets to trade (market_id: 0=ETH, 1=BTC)
  # GLM-5 analysis: ETH WinRate=20%, MaxDD=34% → removed
  markets: [1]

  # Maximum number of open orders at any time
  max_open_orders: 8

  # Strategy configuration
  # 2026-08-02 切换为趋势策略（fast=14/slow=50/sl=0.05/tp=0.06, notional=200）:
  #   960 次多窗口扫描（240 组 × 4 窗口 01-01~07-25），唯一 4/4 窗口全正组合，全周期 +9.78%
  #   grid 实盘同款（12/30/0.004）4 窗口全负（-15%~-27.5%）、全周期 -52.6%、跑输 BTC 基准 25pt —— 亏损根因
  #   样本外 8 天（07-25~08-02）震荡市 -6.24% vs grid -1.12%：趋势策略赢单边、震荡期会被反复止损
  #   详细记录: backtests/results/trend-scan-20260802/FINDINGS.md（gitignore，不进版本库）
  #   回滚方法: grid_trading.enabled 改回 true、trend_following.enabled 改回 false，重启 pm2
  strategies:
    grid_trading:
      enabled: false
      grid_count: 12
      investment_per_grid: 30
      price_deviation: 0.004

    trend_following:
      enabled: true
      fast_ma: 14
      slow_ma: 50
      stop_loss: 0.05
      take_profit: 0.06
      trailing_stop: 0.0
      notional: 200
      # ADX 震荡过滤：>0 启用（低于该值=震荡市禁新开仓），0=关闭。默认关闭，回测 A/B 验证后再开。
      adx_threshold: 0
      adx_period: 14
      # 慢线斜率确认：>0 启用（开多需 slow EMA 在 lookback 内上涨该比例，开空则下跌），0=关闭。
      # 只过滤进场、不影响离场。2026-08-02 A/B 验证后启用：全周期+8.92%/胜率50% vs baseline+9.78%/35%，
      # 震荡窗 0 笔（消除 baseline 的 -6.24% 亏损）。ADX 保持关闭。
      confirm_slope_min: 0.005
      confirm_lookback: 5

  # Position management
  position:
    max_single_trade_percent: 50
    max_total_position_percent: 200
    risk_per_trade_percent: 1.5

# Conservative round-trip profitability gate for live entries (1 bp = 0.01%).
# These defaults reflect Lighter Standard's observed zero trading fee, while
# reserving explicit budgets for execution drag and adverse selection.
profitability:
  enabled: true
  entry_fee_bps: 0.0
  exit_fee_bps: 0.0
  entry_slippage_bps: 2.0
  exit_slippage_bps: 2.0
  funding_bps: 0.5
  adverse_selection_bps: 3.0
  min_net_edge_bps: 2.0

# Risk management
risk:
  stop_loss:
    enabled: true
    max_drawdown_percent: 10
    daily_loss_limit_percent: 5
    # Per-position stop-loss/take-profit (percentage from entry)
    position_stop_loss_percent: 3
    position_take_profit_percent: 5

  position_limit:
    max_leverage: 5
    max_position_size: 100

  monitoring_interval_ms: 1000

# Backtest configuration
backtest:
  data:
    start_date: "2024-01-01"
    end_date: "2024-06-01"
    interval: "1h"

  initial_capital: 10000
  commission_percent: 0.0
  slippage_percent: 0.02

  reporting:
    generate_html: true
    save_trades: true
    plot_equity_curve: true

# Dashboard
dashboard:
  enabled: true
  host: "127.0.0.1"
  port: 2028
  refresh_interval_ms: 1000

  charts:
    equity_curve_points: 1000
    order_book_depth: 20

# Logging
logging:
  level: "info"
  file: "logs/lighter-bot.log"
  rotation: "daily"
  format: "json"
